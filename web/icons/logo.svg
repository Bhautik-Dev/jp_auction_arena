<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1026" />
      <stop offset="100%" stop-color="#141B3A" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#primaryGradient)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Neon Arena Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGradient)" stroke-width="8" stroke-dasharray="20 10" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="#141B3A" fill-opacity="0.7" stroke="url(#primaryGradient)" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Cricket Crossed Bats Symbol -->
  <g transform="translate(256, 240) rotate(-35)">
    <rect x="-14" y="-110" width="28" height="150" rx="8" fill="url(#primaryGradient)" />
    <rect x="-8" y="40" width="16" height="60" rx="5" fill="#F8FAFC" />
  </g>
  <g transform="translate(256, 240) rotate(35)">
    <rect x="-14" y="-110" width="28" height="150" rx="8" fill="url(#primaryGradient)" />
    <rect x="-8" y="40" width="16" height="60" rx="5" fill="#F8FAFC" />
  </g>

  <!-- Center Auction Gavel / Ball Accent -->
  <circle cx="256" cy="230" r="32" fill="url(#goldGradient)" filter="url(#neonGlow)" />
  <path d="M 230 220 Q 256 242 282 220" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M 230 240 Q 256 218 282 240" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Gavel Base -->
  <rect x="216" y="320" width="80" height="20" rx="6" fill="url(#primaryGradient)" />
  <polygon points="256,260 248,320 264,320" fill="#FFFFFF" opacity="0.8" />

  <!-- Typography Brand JP -->
  <text x="256" y="410" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">JP ARENA</text>
  <text x="256" y="438" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#EC4899" text-anchor="middle" letter-spacing="3">AUCTION ARENA</text>
</svg>
