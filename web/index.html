<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="JP AUCTION ARENA - Cricket Auction Management Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JP AUCTION ARENA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JP AUCTION ARENA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B1026 radial-gradient(circle at 50% 30%, #141B3A 0%, #0B1026 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    .brand-logo-container {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .brand-logo-container svg {
      width: 52px;
      height: 52px;
    }
    .loading-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 1px;
      margin-bottom: 26px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top: 3px solid #EC4899;
      border-right: 3px solid #3B82F6;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-logo-container">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.5 2.5L19.5 7.5L8.5 18.5H3.5V13.5L14.5 2.5Z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 4L18 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="18.5" cy="18.5" r="3" fill="#FFD700" stroke="#FFFFFF" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="loading-title">JP AUCTION ARENA</div>
    <div class="loading-subtitle">Cricket Auction Management System</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service_worker.js').catch(function(err) {
          console.log('ServiceWorker registration skipped or failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
